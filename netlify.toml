[build]
  publish = "."

# Static site — nothing to compile.
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Test builds handed out to people directly. nosniff is set site-wide above, so
# the APK has to state its real type or the browser refuses to act on it.
# Unlisted rather than secret — noindex keeps it out of search results.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=3600"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
