<style>
  .song{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md); padding:clamp(18px,4vw,30px); max-width:820px;
  }
  .song-tag{
    display:inline-block; background:var(--orange-soft); color:var(--orange-dark);
    font-weight:800; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px; margin:0 0 12px;
  }
  .song-title{ font-size:clamp(1.9rem,6vw,2.8rem); margin:0 0 4px; }
  .song-by{ color:var(--ink-3); margin:0 0 20px; }
  .song-player{
    position:relative; width:100%; height:240px;
    border-radius:var(--radius); overflow:hidden; background:#0B0D12;
  }
  .song-player iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .song-link{ margin:14px 0 0; font-size:.95rem; }
</style>
